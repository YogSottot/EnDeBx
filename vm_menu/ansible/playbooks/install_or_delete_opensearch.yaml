---
- name: "{{ opensearch_action | default('INSTALL') }} OpenSearch"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  pre_tasks:
    - name: Set facts for Astra Linux
      ansible.builtin.include_tasks: "tasks/set_facts_for_astra.yaml"
      tags: always

  tasks:
    - name: Run OpenSearch role
      ansible.builtin.include_role:
        name: opensearch
