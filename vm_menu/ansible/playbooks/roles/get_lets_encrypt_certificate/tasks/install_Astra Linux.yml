- name: Install required packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - libaugeas0
    state: present

- name: Get system Python version
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import sys; print('%s.%s' % sys.version_info[:2])"
  register: _certbot_system_python_version
  changed_when: false
  check_mode: false

- name: Check Certbot virtual env Python and pip
  ansible.builtin.command:
    argv:
      - /opt/certbot/bin/python
      - -c
      - "import sys; from pip._internal.cli.main import main; print('%s.%s' % sys.version_info[:2])"
  register: _certbot_virtualenv_python_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create or upgrade Certbot virtual env
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - --upgrade
      - /opt/certbot/
  changed_when: true
  when: >-
    _certbot_virtualenv_python_version.rc != 0 or
    _certbot_virtualenv_python_version.stdout != _certbot_system_python_version.stdout

- name: Upgrade pip in virtual environment
  ansible.builtin.pip:
    name: pip
    state: latest
    virtualenv: /opt/certbot/

- name: Install certbot in virtual environment
  ansible.builtin.pip:
    name: certbot
    virtualenv: /opt/certbot/

- name: Create symlink for certbot
  ansible.builtin.file:
    src: /opt/certbot/bin/certbot
    dest: /usr/bin/certbot
    state: link

- name: Add certbot renewal cron job
  ansible.builtin.cron:
    name: "Certbot renewal"
    minute: "00"
    hour: "01"
    job: "certbot renew -q"
    user: root
    cron_file: certbot

- name: Upgrade certbot monthly
  ansible.builtin.cron:
    name: "Upgrade certbot"
    special_time: monthly
    job: "/opt/certbot/bin/pip install --upgrade certbot"
    user: root
