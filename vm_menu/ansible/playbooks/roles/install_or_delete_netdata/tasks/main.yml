---
# tasks file for install_or_delete_netdata

- name: Install netdata
  when: netdata_action == 'INSTALL'
  block:
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download temporary Netdata repository key
      ansible.builtin.get_url:
        url: https://repository.netdata.cloud/netdatabot.gpg.key
        dest: /etc/apt/keyrings/netdata-archive-keyring.asc
        owner: root
        group: root
        mode: '0644'

    - name: Add Netdata repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/netdata.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          Types: deb
          URIs: http://repository.netdata.cloud/repos/stable/{{ ansible_distribution | lower }}/
          Suites: {{ ansible_distribution_release }}/
          By-Hash: Yes
          Enabled: Yes
          Signed-By: /etc/apt/keyrings/netdata-archive-keyring.asc

    - name: Update apt cache for Netdata version discovery
      ansible.builtin.apt:
        update_cache: true

    - name: Get available Netdata package versions
      ansible.builtin.command:
        argv:
          - apt-cache
          - madison
          - "{{ item }}"
      loop:
        - netdata
        - netdata-plugin-chartsd
        - netdata-plugin-pythond
      register: netdata_available_versions
      changed_when: false
      check_mode: false

    - name: Find common Netdata package versions
      ansible.builtin.set_fact:
        netdata_common_versions: >-
          {{ netdata_available_versions.results[0].stdout.splitlines()
             | map('regex_replace', '^[^|]*\|\s*([^|]*?)\s*\|.*$', '\\1')
             | intersect(netdata_available_versions.results[1].stdout.splitlines()
                         | map('regex_replace', '^[^|]*\|\s*([^|]*?)\s*\|.*$', '\\1'))
             | intersect(netdata_available_versions.results[2].stdout.splitlines()
                         | map('regex_replace', '^[^|]*\|\s*([^|]*?)\s*\|.*$', '\\1')) }}

    - name: Ensure a common Netdata package version is available
      ansible.builtin.assert:
        that:
          - netdata_common_versions | length > 0
        fail_msg: No common version is available for Netdata, chartsd and pythond packages.

    - name: Select latest common Netdata package version
      ansible.builtin.shell: |
        latest=''
        for version in $NETDATA_VERSIONS; do
          if [ -z "$latest" ] || dpkg --compare-versions "$version" gt "$latest"; then
            latest="$version"
          fi
        done
        printf '%s\n' "$latest"
      environment:
        NETDATA_VERSIONS: "{{ netdata_common_versions | join(' ') }}"
      register: netdata_selected_version
      changed_when: false
      check_mode: false

    - name: Install Netdata packages
      ansible.builtin.apt:
        name:
          - "netdata={{ netdata_selected_version.stdout }}"
          - "netdata-plugin-chartsd={{ netdata_selected_version.stdout }}"
          - "netdata-plugin-pythond={{ netdata_selected_version.stdout }}"
        state: present

    - name: Copying {{ service_nginx_name }} directory to /etc/{{ service_nginx_name }}
      ansible.builtin.copy:
        src: "nginx/"
        dest: "/etc/{{ service_nginx_name }}/"
        mode: '644'

    - name: Restarting Nginx
      ansible.builtin.systemd:
        name: "{{ service_nginx_name }}"
        state: restarted

- name: Delete netdata
  when: netdata_action == 'DELETE'
  block:
    - name: Find files deleting nginx configs
      ansible.builtin.find:
        paths: "{{ role_path }}/files/{{ service_nginx_name }}"
        file_type: file
        recurse: true
      register: found_files

    - name: Deleting files in /etc/{{ service_nginx_name }}
      ansible.builtin.file:
        path: "/etc/nginx/{{ item.path | regex_replace('^' + role_path + '/files/' + service_nginx_name + '/', '') }}"
        state: absent
      loop: "{{ found_files.files }}"

    - name: Stopping Netdata service
      ansible.builtin.systemd:
        name: netdata
        state: stopped

    - name: Disable Netdata service
      ansible.builtin.systemd:
        name: netdata
        enabled: false

    - name: Deleting Netdata package
      ansible.builtin.apt:
        name:
          - netdata
        state: absent
        purge: true

    - name: Deleting Netdata directory
      ansible.builtin.file:
        path: /usr/sbin/netdata
        state: absent

    - name: Deleting Netdata configuration files
      ansible.builtin.file:
        path: /etc/netdata
        state: absent

    - name: Deleting Netdata logs
      ansible.builtin.file:
        path: /var/log/netdata
        state: absent

    - name: Deleting Netdata apt repository files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/netdata.sources
        - /etc/apt/sources.list.d/netdata.list

    - name: Deleting temporary Netdata repository key
      ansible.builtin.file:
        path: /etc/apt/keyrings/netdata-archive-keyring.asc
        state: absent

    - name: Deleting Netdata user package
      ansible.builtin.apt:
        name: netdata-user
        state: absent
        purge: true

    - name: Restarting Nginx
      ansible.builtin.systemd:
        name: "{{ service_nginx_name }}"
        state: restarted
