# make it separate fo each site
map $http_referer $frame_options {
    default "SAMEORIGIN";
    
    "~^https?://([^\/]+\.)?(webvisor\.(com|org))"  "";
    "~^https?://([^\/]+\.)?(yandex\.com)"          "";

    # Yandex Metrica / Webvisor
    "~^https?://mc\.yandex\.(ru|az|by|co\.il|com|com\.am|com\.ge|com\.tr|ee|fr|kg|kz|lt|lv|md|tj|tm|uz)(:[0-9]+)?(/|$)" "";

    "~^https?://mc\.webvisor\.(com|org)(:[0-9]+)?(/|$)" "";

    # Yandex Static
    "~^https?://yastatic\.net(:[0-9]+)?(/|$)" "";

    # Analytics / Metr / Metrica / Metrika
    "~^https?://(analytics|metr|metrica|metrika)\.yandex\.(ru|by|com|com\.tr|kz|uz)(:[0-9]+)?(/|$)" "";

    # metrica.ya.ru / metrika.ya.ru
    "~^https?://metri[ck]a\.ya\.ru(:[0-9]+)?(/|$)" "";

    # metrica.yandex / metrika.yandex
    "~^https?://metri[ck]a\.yandex(:[0-9]+)?(/|$)" "";
}
