---
- name: Update apt and install curl gnupg apt-transport-https
  ansible.builtin.package:
    update_cache: true
    name:
      - curl
      - gnupg
      - apt-transport-https
      - debian-archive-keyring
      - nftables
    state: present

- name: Start nftables services
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
  when: default_os_firewall == 'nftables'

- name: Crowdsec Add GPG apt Key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /etc/apt/keyrings/crowdsec.asc
    mode: '0644'
    owner: root
    group: root

- name: Crowdsec Add Repository
  ansible.builtin.deb822_repository:
    name: crowdsec
    types: deb
    uris: https://packagecloud.io/crowdsec/crowdsec/any/
    suites: any
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/crowdsec.asc
    state: present
